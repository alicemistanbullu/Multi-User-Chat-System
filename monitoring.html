
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat Server Monitoring</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b141a;
            color: #e9edef;
        }

        header {
            background: #202c33;
            padding: 20px 30px;
            border-bottom: 1px solid #34434d;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        header p {
            color: #8696a0;
            margin-bottom: 0;
            font-size: 13px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #202c33;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid #34434d;
        }

        .stat-box p {
            color: #8696a0;
            margin: 0;
            font-size: 13px;
        }

        .stat-box h2 {
            font-size: 32px;
            margin: 12px 0 0;
            color: #25d366;
        }

        .chat-container {
            background: #111b21;
            border: 1px solid #34434d;
            border-radius: 12px;
            overflow: hidden;
        }

        .chat-header {
            background: #202c33;
            padding: 17px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 17px;
            margin: 0;
        }

        .status {
            color: #25d366;
            font-size: 12px;
        }

        #events {
            height: 520px;
            overflow-y: auto;
            padding: 25px;
            background-color: #0b141a;
            background-image: radial-gradient(#1b2a33 1px, transparent 1px);
            background-size: 22px 22px;
        }

        .event {
            display: flex;
            margin-bottom: 15px;
        }

        .event.public,
        .event.private,
        .event.error,
        .event.rate_limit {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            background: #202c33;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .public .bubble {
            background: #005c4b;
        }

        .private .bubble {
            background: #263c53;
        }

        .error .bubble,
        .rate_limit .bubble {
            background: #512b32;
        }

        .sender {
            font-size: 12px;
            font-weight: bold;
            color: #53d6b0;
            margin-bottom: 5px;
        }

        .private .sender {
            color: #8ab4f8;
        }

        .error .sender,
        .rate_limit .sender {
            color: #ff8585;
        }

        .message {
            font-size: 14px;
            white-space: pre-wrap;
        }

        .time {
            text-align: right;
            color: #aebac1;
            font-size: 10px;
            margin-top: 5px;
        }

        .system-event {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .system-event span {
            background: #182229;
            color: #b5c0c5;
            font-size: 12px;
            padding: 7px 14px;
            border-radius: 8px;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #667781;
            padding: 20px;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            #events {
                height: 450px;
                padding: 15px;
            }

            .bubble {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Chat Server Monitor</h1>
        <p>Multi-User Chat System | Live Dashboard</p>
    </header>

    <div class="container">

        <div class="stats">

            <div class="stat-box">
                <p>CONNECTED USERS</p>
                <h2 id="users">0</h2>
            </div>

            <div class="stat-box">
                <p>PROCESSED MESSAGES</p>
                <h2 id="messages">0</h2>
            </div>

        </div>

        <div class="chat-container">

            <div class="chat-header">
                <h2>Live Server Events</h2>
                <span class="status" id="status">● Connecting...</span>
            </div>

            <div id="events"></div>

        </div>

    </div>

    <footer>
        Multi-User Chat System | Server Monitoring
    </footer>

    <script>
        const ws = new WebSocket("ws://" + location.hostname + ":8765");

        const users = document.getElementById("users");
        const messages = document.getElementById("messages");
        const events = document.getElementById("events");
        const status = document.getElementById("status");

        ws.onopen = () => {
            status.textContent = "● Connected";
            status.style.color = "#25d366";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.users !== undefined) {
                users.textContent = data.users;
            }

            if (data.messages !== undefined) {
                messages.textContent = data.messages;
            }

            if (data.type !== "stats") {
                const type = data.type.toLowerCase();

                const div = document.createElement("div");
                div.className = "event";

                const bubble = document.createElement("div");
                bubble.className = "bubble";

                const sender = document.createElement("div");
                sender.className = "sender";

                const message = document.createElement("div");
                message.className = "message";

                const time = document.createElement("div");
                time.className = "time";

                const content = data.message || "";

                if (type === "public") {
                    div.classList.add("public");
                    sender.textContent = "PUBLIC MESSAGE";
                    message.textContent = content;

                } else if (type === "private") {
                    div.classList.add("private");
                    sender.textContent = "PRIVATE MESSAGE";
                    message.textContent = content;

                } else if (type === "connection") {
                    div.classList.add("system-event");
                    const info = document.createElement("span");
                    info.textContent = "🟢 " + content;
                    div.appendChild(info);

                } else if (type === "disconnection") {
                    div.classList.add("system-event");
                    const info = document.createElement("span");
                    info.textContent = "⚪ " + content;
                    div.appendChild(info);

                } else {
                    div.classList.add("error");

                    if (type === "rate_limit") {
                        div.classList.add("rate_limit");
                        sender.textContent = "RATE LIMIT";
                    } else {
                        sender.textContent = "SERVER EVENT";
                    }

                    message.textContent = content;
                }

                if (type !== "connection" && type !== "disconnection") {
                    time.textContent = data.time || "";

                    bubble.appendChild(sender);
                    bubble.appendChild(message);
                    bubble.appendChild(time);

                    div.appendChild(bubble);
                }

                events.prepend(div);
            }
        };

        ws.onclose = () => {
            status.textContent = "● Disconnected";
            status.style.color = "#ff6b6b";
        };

        ws.onerror = () => {
            status.textContent = "● Connection Error";
            status.style.color = "#ff6b6b";
        };
    </script>

</body>
</html>
