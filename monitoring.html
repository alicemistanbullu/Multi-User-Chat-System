
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Monitoring Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 30px;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 26px;
            color: #f8fafc;
        }

        header p {
            color: #94a3b8;
            margin-top: 7px;
            font-size: 14px;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 9px;
            background: #1e293b;
            padding: 11px 17px;
            border-radius: 8px;
            font-size: 13px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ef4444;
        }

        .connected {
            background: #22c55e;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .card-title {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .card-value {
            font-size: 34px;
            font-weight: bold;
            color: #f8fafc;
        }

        .card-icon {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }

        .content-header {
            padding: 22px 25px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-header h2 {
            font-size: 17px;
        }

        .event-count {
            color: #94a3b8;
            font-size: 13px;
        }

        #events {
            height: 430px;
            overflow-y: auto;
            padding: 15px 22px;
        }

        .event {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: #263449;
            border-radius: 8px;
            border-left: 4px solid #64748b;
        }

        .event-icon {
            font-size: 18px;
        }

        .event-body {
            flex: 1;
            min-width: 0;
        }

        .event-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .event-message {
            color: #cbd5e1;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .event-time {
            color: #64748b;
            font-size: 11px;
            white-space: nowrap;
        }

        .public {
            border-left-color: #3b82f6;
        }

        .private {
            border-left-color: #a78bfa;
        }

        .connection-event {
            border-left-color: #22c55e;
        }

        .disconnection {
            border-left-color: #f59e0b;
        }

        .error {
            border-left-color: #ef4444;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 70px 20px;
            font-size: 14px;
        }

        button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #475569;
        }

        @media (max-width: 750px) {
            body {
                padding: 15px;
            }

            header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .event {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>Chat Monitoring</h1>
            <p>Real-time server activity dashboard</p>
        </div>

        <div class="connection">
            <span class="status-dot" id="statusDot"></span>
            <span id="connectionText">Disconnected</span>
        </div>
    </header>

    <section class="cards">

        <div class="card">
            <div class="card-icon">👥</div>
            <div class="card-title">Connected Users</div>
            <div class="card-value" id="userCount">0</div>
        </div>

        <div class="card">
            <div class="card-icon">💬</div>
            <div class="card-title">Processed Messages</div>
            <div class="card-value" id="messageCount">0</div>
        </div>

        <div class="card">
            <div class="card-icon">📡</div>
            <div class="card-title">Total Events</div>
            <div class="card-value" id="eventCount">0</div>
        </div>

    </section>

    <section class="content">

        <div class="content-header">
            <h2>Live Activity</h2>
            <button onclick="clearEvents()">Clear Events</button>
        </div>

        <div id="events">
            <div class="empty" id="emptyMessage">
                Waiting for server events...
            </div>
        </div>

    </section>

</div>

<script>
    const eventsArea = document.getElementById("events");
    const statusDot = document.getElementById("statusDot");
    const connectionText = document.getElementById("connectionText");

    let totalEvents = 0;

    function connectWebSocket() {
        const ws = new WebSocket(
            "ws://" + location.hostname + ":8765"
        );

        ws.onopen = function() {
            statusDot.classList.add("connected");
            connectionText.textContent = "Connected";
        };

        ws.onclose = function() {
            statusDot.classList.remove("connected");
            connectionText.textContent = "Disconnected";

            setTimeout(connectWebSocket, 2000);
        };

        ws.onerror = function() {
            ws.close();
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.users !== undefined) {
                document.getElementById("userCount").textContent =
                    data.users;
            }

            if (data.messages !== undefined) {
                document.getElementById("messageCount").textContent =
                    data.messages;
            }

            if (data.type === "stats") {
                return;
            }

            addEvent(data);
        };
    }

    function addEvent(data) {
        const emptyMessage = document.getElementById("emptyMessage");

        if (emptyMessage) {
            emptyMessage.remove();
        }

        totalEvents++;

        document.getElementById("eventCount").textContent =
            totalEvents;

        let title = "Server Event";
        let icon = "📌";
        let eventClass = "";

        if (data.type === "public") {
            title = "Public Message";
            icon = "💬";
            eventClass = "public";
        }
        else if (data.type === "private") {
            title = "Private Message";
            icon = "✉️";
            eventClass = "private";
        }
        else if (data.type === "connection") {
            title = "User Connected";
            icon = "🟢";
            eventClass = "connection-event";
        }
        else if (
            data.type === "disconnection" ||
            data.type === "dissconnection"
        ) {
            title = "User Disconnected";
            icon = "🟠";
            eventClass = "disconnection";
        }
        else if (
            data.type === "rate_limit" ||
            data.type === "rate_limt"
        ) {
            title = "Rate Limit";
            icon = "⚠️";
            eventClass = "error";
        }
        else if (data.type === "error") {
            title = "Server Error";
            icon = "🔴";
            eventClass = "error";
        }

        const eventBox = document.createElement("div");
        eventBox.className = "event " + eventClass;

        const eventIcon = document.createElement("div");
        eventIcon.className = "event-icon";
        eventIcon.textContent = icon;

        const eventBody = document.createElement("div");
        eventBody.className = "event-body";

        const eventTitle = document.createElement("div");
        eventTitle.className = "event-title";
        eventTitle.textContent = title;

        const eventMessage = document.createElement("div");
        eventMessage.className = "event-message";
        eventMessage.textContent = data.message || "";

        const eventTime = document.createElement("div");
        eventTime.className = "event-time";
        eventTime.textContent = data.time || "";

        eventBody.appendChild(eventTitle);
        eventBody.appendChild(eventMessage);

        eventBox.appendChild(eventIcon);
        eventBox.appendChild(eventBody);
        eventBox.appendChild(eventTime);

        eventsArea.prepend(eventBox);

        while (eventsArea.children.length > 100) {
            eventsArea.removeChild(eventsArea.lastChild);
        }
    }

    function clearEvents() {
        eventsArea.innerHTML =
            '<div class="empty" id="emptyMessage">Waiting for server events...</div>';

        totalEvents = 0;
        document.getElementById("eventCount").textContent = "0";
    }

    connectWebSocket();
</script>

</body>
</html>
